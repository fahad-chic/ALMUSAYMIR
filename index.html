  <style>
    .rooz-boot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      opacity: 0;
      animation: roozFadeIn .7s ease .05s forwards;
    }

    .rooz-boot img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 8px 22px rgba(15, 23, 42, .22));
    }

    .rooz-boot .rooz-boot-bar {
      width: 132px;
      height: 3px;
      border-radius: 999px;
      background: rgba(15, 23, 42, .14);
      overflow: hidden;
      position: relative;
    }

    .rooz-boot .rooz-boot-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(90deg, #0F172A, #C9A227);
      animation: roozSlide 1.15s ease-in-out infinite;
    }

    input,
    textarea,
    select,
    button {
      font-size: 16px;
    }

    @keyframes roozFadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes roozSlide {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(320%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .rooz-boot {
        animation: none;
        opacity: 1;
      }

      .rooz-boot .rooz-boot-bar::after {
        animation: none;
        width: 100%;
      }
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #F7F1E7;
    }
  </style>
