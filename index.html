<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>نسبة الموقع والحسابات البنكية - أناقة ROOZ</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1E293B;
      --navy-soft: #2A3A4F;
      --beige: #E8E2D6;
      --beige-dark: #D4C5A9;
      --cream: #F7F3EB;
      --text: #1E293B;
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Tajawal', system-ui, sans-serif;
      background: linear-gradient(160deg, #F7F3EB 0%, #E8E2D6 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ========== نسبة الموقع ========== */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 12px;
    }

    .section-title svg {
      width: 22px;
      height: 22px;
    }

    .commission-card {
      background: var(--navy);
      border-radius: var(--radius);
      padding: 1.4rem 1.2rem;
      text-align: center;
      box-shadow: 0 12px 32px rgba(30, 41, 59, 0.25);
    }

    .rates-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .rate-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 110px;
    }

    .rate-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #E8E2D6;
      opacity: 0.95;
    }

    .rate-value {
      font-size: 1.85rem;
      font-weight: 900;
      color: #E8E2D6;              /* بيج واضح 100% */
      letter-spacing: -0.5px;
      display: flex;
      align-items: baseline;
      gap: 2px;
    }

    .rate-value .percent {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .divider {
      width: 1px;
      background: rgba(232, 226, 214, 0.35);
      align-self: stretch;
    }

    .commission-note {
      font-size: 0.92rem;
      font-weight: 700;             /* عريض */
      color: #E8E2D6;               /* بيج واضح 100% */
      line-height: 1.55;
      opacity: 1;
      border-top: 1px solid rgba(232, 226, 214, 0.25);
      padding-top: 12px;
      margin-top: 2px;
    }

    /* ========== الحسابات البنكية ========== */
    .bank-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bank-card {
      background: #FFFFFF;
      border: 1px solid rgba(30, 41, 59, 0.12);
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 3px 12px rgba(30, 41, 59, 0.07);
    }

    .bank-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .bank-name {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--navy);
    }

    .bank-icon {
      width: 22px;
      height: 22px;
      background: var(--navy);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--beige);
      font-size: 11px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;                     /* تقريب السطور أكثر */
    }

    .field-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--cream);
      border-radius: 8px;
      padding: 4px 8px;             /* تصغير ارتفاع المربع أكثر */
      width: fit-content;           /* العرض حسب النص فقط */
      max-width: 100%;
    }

    .field-label {
      font-size: 0.68rem;
      font-weight: 600;
      color: #6B7280;
      min-width: 32px;
    }

    .field-value {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 0.2px;
      direction: ltr;
      text-align: left;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .copy-btn {
      background: var(--navy);
      color: #E8E2D6;
      border: none;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .copy-btn:hover {
      background: var(--navy-soft);
    }

    .copy-btn:active {
      transform: scale(0.95);
    }

    .copy-btn.copied {
      background: #059669;
      color: white;
    }

    /* تنبيه النجاح */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--navy);
      color: #E8E2D6;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.35s ease;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* زر رجوع */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1.5px solid rgba(30, 41, 59, 0.2);
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--navy);
      cursor: pointer;
      margin-bottom: 8px;
      align-self: flex-start;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- زر رجوع (اختياري) -->
    <button class="back-btn" onclick="history.back()">
      رجوع ←
    </button>

    <!-- ========== نسبة الموقع ========== -->
    <section>
      <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        نسبة الموقع
      </div>

      <div class="commission-card">
        <div class="rates-row">
          <!-- السلع الجديدة -->
          <div class="rate-item">
            <div class="rate-label">السلع الجديدة</div>
            <div class="rate-value">
              <span>2</span><span class="percent">٪</span>
            </div>
          </div>

          <div class="divider"></div>

          <!-- السلع المستخدمة -->
          <div class="rate-item">
            <div class="rate-label">السلع المستخدمة</div>
            <div class="rate-value">
              <span>1</span><span class="percent">٪</span>
            </div>
          </div>
        </div>

        <div class="commission-note">
          وتعتبر هذه النسبة في ذمة المعلن عند بيع السلعة
        </div>
      </div>
    </section>

    <!-- ========== الحسابات البنكية ========== -->
    <section>
      <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <path d="M2 10h20"/>
        </svg>
        الحسابات البنكية
      </div>

      <div class="bank-section">

        <!-- بنك الراجحي -->
        <div class="bank-card">
          <div class="bank-header">
            <div class="bank-name">بنك الراجحي</div>
            <div class="bank-icon">🏦</div>
          </div>

          <div class="field-group">
            <div class="field-row">
              <span class="field-label">IBAN</span>
              <span class="field-value" id="iban1">SA0980000509608010069017</span>
              <button class="copy-btn" onclick="copyText('iban1', this)">نسخ</button>
            </div>

            <div class="field-row">
              <span class="field-label">الحساب</span>
              <span class="field-value" id="acc1">09608010069017</span>
              <button class="copy-btn" onclick="copyText('acc1', this)">نسخ</button>
            </div>
          </div>
        </div>

        <!-- بنك العربي -->
        <div class="bank-card">
          <div class="bank-header">
            <div class="bank-name">بنك العربي</div>
            <div class="bank-icon">🏛</div>
          </div>

          <div class="field-group">
            <div class="field-row">
              <span class="field-label">IBAN</span>
              <span class="field-value" id="iban2">SA9830400108088851870011</span>
              <button class="copy-btn" onclick="copyText('iban2', this)">نسخ</button>
            </div>

            <div class="field-row">
              <span class="field-label">الحساب</span>
              <span class="field-value" id="acc2">0108088851870011</span>
              <button class="copy-btn" onclick="copyText('acc2', this)">نسخ</button>
            </div>
          </div>
        </div>

      </div>
    </section>

  </div>

  <!-- رسالة نسخ -->
  <div class="toast" id="toast">تم النسخ ✓</div>

  <script>
    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const original = btn.innerText;
        btn.innerText = 'تم';
        btn.classList.add('copied');

        const toast = document.getElementById('toast');
        toast.classList.add('show');

        setTimeout(() => {
          btn.innerText = original;
          btn.classList.remove('copied');
          toast.classList.remove('show');
        }, 1800);
      }).catch(() => {
        alert('تعذر النسخ، انسخ يدويًا');
      });
    }
  </script>
</body>
</html>
