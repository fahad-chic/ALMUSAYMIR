  <style>
    /* شاشة الإقلاع تُرسم فوراً بلا انتقال شفافية: الشفافية الابتدائية كانت
       تُبقي أول رسم مرئي (FCP) مؤجّلاً حتى نهاية الأنيميشن. */
    .alm-boot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .alm-boot img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 8px 22px rgba(15, 23, 42, .22));
    }

    .alm-boot-name {
      font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
      font-weight: 900;
      font-size: 1.35rem;
      line-height: 1.3;
      color: #0F172A;
      letter-spacing: 0.01em;
      text-align: center;
    }

    .alm-boot .alm-boot-bar {
      width: 132px;
      height: 3px;
      border-radius: 999px;
      background: rgba(15, 23, 42, .14);
      overflow: hidden;
      position: relative;
    }

    .alm-boot .alm-boot-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(90deg, #0F172A, #C9A227);
      animation: almSlide 1.15s ease-in-out infinite;
    }

    input,
    textarea,
    select,
    button {
      font-size: 16px;
    }

    @keyframes almSlide {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(320%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .alm-boot .alm-boot-bar::after {
        animation: none;
        width: 100%;
      }
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #F7F1E7;
    }
  </style>

  <div id="root">

        <img

        />
      </picture>
      <span class="alm-boot-name">المسيمير | ALMUSAYMIR</span>
      <span class="alm-boot-bar"></span>
    </div>
  </div>
